<section class="panel" id="setup"><h2>進入料理教室</h2><p>老師建立房間，學生輸入相同的六位數房號加入。每人使用自己的裝置。</p><label>廚師暱稱 <input id="nickname" maxlength="14" placeholder="例如：小狐狸廚師"></label><p><label>加入房號 <input id="roomInput" maxlength="6" inputmode="numeric" placeholder="六位數房號"></label></p><div class="actions"><button class="action" id="create">老師建立房間</button><button class="action sub" id="join">學生加入房間</button></div><p class="hint">規則：每題不限時；答對得 1 顆星星。答錯會出現搞笑圖片，重試答對仍可得星星。全員完成後自動換題，先拿到 5 顆星星就獲勝；若達到題數上限，依總星數頒獎。</p><p id="setupMsg"></p></section>

async function enter(create){$('create').disabled=$('join').disabled=true;$('setupMsg').textContent='連線中…';try{const name=$('nickname').value.trim();if(!name)throw Error('請先輸入暱稱');await init();const code=create?String(Math.floor(100000+Math.random()*900000)):$('roomInput').value.trim();if(!/^\d{6}$/.test(code))throw Error('房號必須是六位數');const r=ref(db,'rooms/'+code),snap=await get(r);if(create){if(snap.exists())throw Error('房號重複，請重試');const t=await runTransaction(r,v=>v===null?{host:id,round:0,phase:'lobby',createdAt:Date.now()}:undefined,{applyLocally:false});if(!t.committed)throw Error('房號重複，請重試')}else if(!snap.exists())throw Error('找不到房間');room=code;host=create||snap.val()?.host===id;const pr=ref(db,`rooms/${room}/players/${id}`);const previous=(await get(pr)).val();await set(pr,{name,score:previous?.score||0,done:false,failed:false,recipes:previous?.recipes||[],joinedAt:previous?.joinedAt||Date.now()});await onDisconnect(pr).remove();$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomLabel').textContent=room;$('role').textContent=host?'老師／房主':'小廚師';$('hostControls').classList.toggle('hidden',!host);onValue(r,s=>{if(!s.exists()){message('房間已關閉，請重新整理');return}data=s.val();render();if(host&&data.phase==='playing'){const players=activePlayers();if(players.some(([,p])=>Number(p.score||0)>=5) || (Number(data.round)>=maxRounds() && players.length && players.every(([,p])=>p.done))){runTransaction(ref(db,`rooms/${room}/phase`),phase=>phase==='playing'?'finished':undefined,{applyLocally:false}).catch(e=>message('冠軍同步失敗：'+e.message))}else if(players.length&&players.every(([,p])=>p.done)){autoAdvanceRound(data.round)}}},e=>message('連線失敗：'+e.message))}catch(e){$('setupMsg').textContent='無法進入：'+e.message;console.error(e)}finally{$('create').disabled=$('join').disabled=false}}
$('create').onclick=()=>enter(true);$('join').onclick=()=>enter(false);
const roomRef=()=>ref(db,'rooms/'+room), playerRef=()=>ref(db,`rooms/${room}/players/${id}`);
function activePlayers(){return Object.entries(data.players||{}).filter(([pid])=>pid!==data.host).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0))}
// 每個房間使用同一組固定亂數種子：全班題序與卡片順序同步，無須新增 Firebase 欄位。
function seededShuffle(items,seed){
  const arr=[...items];let x=(seed>>>0)||1;
  for(let i=arr.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;const j=(x>>>0)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}
function maxRounds(){return Math.min(questions.length,Math.max(5,Number(data.gameLength)||5))}
function roomSeed(){return ((Number(room)||0) ^ (Number(data.createdAt)||0))>>>0}
// 題袋由老師寫入 Firebase；同房間重玩接續抽取，40 題用完才重新洗牌。
function newBag(seed){return seededShuffle(questions.map((_,i)=>i),seed)}
function questionIndexAt(round, state=data){
  const queue=state.questionQueue;
  const cursor=Number(state.questionCursor)||0;
  if(Array.isArray(queue)&&queue.length>cursor+round-1)return Number(queue[cursor+round-1]);
  const cycle=Math.floor((round-1)/questions.length);
  const seed=((Number(room)||0)^(Number(state.createdAt)||0))>>>0;
  return newBag(seed^Math.imul(cycle+1,0x9e3779b1))[(round-1)%questions.length];
}
function qNow(){
  const round=Math.max(1,Number(data.round)||1);
  const original=questions[questionIndexAt(round)]||questions[0];
  const positions=seededShuffle(original.cards.map((_,i)=>i),roomSeed()^Math.imul(round,0x85ebca6b));
  return {...original,cards:positions.map(i=>original.cards[i]),correct:original.correct.map(i=>positions.indexOf(i))};
}
let splashTimer=null;
function showNextRoundSplash(){
  const splash=document.getElementById('nextRoundSplash');
  splash.classList.add('active');
  if(splashTimer)clearTimeout(splashTimer);
  splashTimer=setTimeout(()=>{splash.classList.remove('active');splashTimer=null},2000);
}
function hideNextRoundSplash(){
  if(splashTimer)clearTimeout(splashTimer);
  splashTimer=null;
  document.getElementById('nextRoundSplash').classList.remove('active');
}
function render(){const phase=data.phase||'lobby',mine=data.players?.[id],ps=activePlayers();if(!mine)return;const round=data.round||0;
if(phase==='finished')hideNextRoundSplash();
if(round!==lastRound){
  // Only show on transitions between questions, not when entering the first round.
  if(phase==='playing' && Number(lastRound)>0 && round>lastRound)showNextRoundSplash();
  selected=[];lastRound=round;seenWrong='';closeModal();
}const playing=phase==='playing';$('questionPanel').classList.toggle('hidden',!playing);$('results').classList.toggle('hidden',!['results','finished'].includes(phase));$('final').classList.toggle('hidden',phase!=='finished');$('start').classList.toggle('hidden',phase!=='lobby');$('lengthControl').classList.toggle('hidden',phase!=='lobby');if(phase==='lobby'&&host)$('gameLength').value=String(data.gameLength||5);$('skip').classList.toggle('hidden',!playing);$('next').classList.toggle('hidden',phase!=='results');$('restart').classList.toggle('hidden',phase!=='finished');$('progress').textContent=`${ps.filter(([,p])=>p.done).length} / ${ps.length} 位完成`;
$('players').innerHTML=ps.map(([,p])=>`<div class="player"><div class="top"><b>${esc(p.name)}</b><span>★ ${p.score||0}/5</span></div><p class="hint">${phase==='lobby'?'準備中':p.done?'已完成，等待其他人':phase==='playing'?'料理中…':'本回合結束'}</p><div class="bar"><div class="fill" style="width:${Math.min(100,(p.score||0)*100/5)}%"></div></div></div>`).join('');
if(playing){const q=qNow();$('round').textContent=`第 ${round} / ${maxRounds()} 題｜不限時`;$('score').textContent=`★ ${mine.score||0} / 5`;$('customer').textContent=`客人：${q.customer}`;$('order').textContent=`「${q.order}」`;$('cards').innerHTML=q.cards.map((c,i)=>`<button class="card ${selected.includes(i)?'selected':''}" data-i="${i}" ${mine.done?'disabled':''}><small>食材卡 ${i+1}</small><strong>${esc(c)}</strong></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);selected=selected.includes(i)?selected.filter(x=>x!==i):selected.length<3?[...selected,i]:selected;render()});$('submit').disabled=host||mine.done||selected.length!==3||busy;$('submit').textContent=mine.done?'已完成本題':`送出料理（${selected.length}/3）`;$('clear').disabled=mine.done;$('myStatus').textContent=host?'老師可以觀察題目及學生進度，不需要作答。':mine.done?('料理成功！已獲得 1 顆星星，等待其他廚師完成。'):(mine.failed?'料理翻車也沒關係！重試答對仍可獲得 1 顆星星。':'答對可獲得 1 顆星星，每題最多 1 顆。');message('大家各自選卡，全部完成後進入結算。');}
else if(phase==='lobby'){message(`目前 ${ps.length} 位廚師入場，老師可以開始遊戲。`)}
else{const rank=[...ps].sort((a,b)=>(b[1].score||0)-(a[1].score||0));$('resultTitle').textContent=phase==='finished'?'料理冠軍誕生！':'本回合排行榜';$('rankings').innerHTML=rank.map(([pid,p],i)=>`<div class="rank">${i+1}. ${esc(p.name)}　★ ${p.score||0} 分 ${phase==='finished'&&(p.score||0)===Math.max(...rank.map(([,v])=>Number(v.score)||0))?'｜冠軍':''}</div>`).join('');const q=qNow();$('answer').innerHTML=`<p><b>本題正確食材：</b>${q.correct.map(i=>esc(q.cards[i])).join(' ／ ')}</p>`;$('resultHint').textContent=phase==='finished'?'遊戲結束！現在才進入 E度測試。':'全班完成後自動進入下一題。';if(phase==='finished'){$('recipes').innerHTML=(mine.recipes||[]).map((r,i)=>`<div class="rank"><p>${i+1}. ${esc(r)}</p><button class="action sub" data-recipe="${i}">複製這道提示詞</button></div>`).join('')||'<p>本次沒有首次答對的料理，可以參考上面的正確答案。</p>';document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(mine.recipes[Number(b.dataset.recipe)]).then(()=>message('提示詞已複製！')).catch(()=>message('複製失敗，請手動選取。')))}if(phase==='finished'&&lastPhase!=='finished'){const names=rank.filter(([,p])=>(p.score||0)===Math.max(...rank.map(([,v])=>Number(v.score)||0))).map(([,p])=>p.name).join('、');showModal(`<div class="banner victory"><div class="winner">🎉 滿漢全席登場！</div><img class="banquet-img" src="${banquetImage}" alt="熱鬧豐盛的滿漢全席慶祝大餐"><h2>恭喜 ${esc(names||'所有小廚神')}！</h2><p>成功完成本場挑戰，成為料理冠軍！</p></div><button class="action" data-close>查看排行榜與 E度提示詞</button>${host?'<button class="action sub" id="victoryReplay">全班再玩一次</button>':'<p>等待老師決定是否再玩一次</p>'}`);document.getElementById("victoryReplay")?.addEventListener("click",()=>{closeModal();document.getElementById("restart").click()})} }
lastPhase=phase;
}
const advancingRounds=new Set();
async function autoAdvanceRound(round){
  if(!host || advancingRounds.has(round))return;
  advancingRounds.add(round);
  try{
    // Use a multi-location update instead of a transaction on the entire room.
    // The database rules allow the host to update room fields, but a root
    // transaction can be rejected when player records have child validation.
    const fresh=(await get(roomRef())).val();
    if(!fresh || fresh.host!==id || fresh.phase!=='playing' || fresh.round!==round)return;
    const players=Object.entries(fresh.players||{}).filter(([pid])=>pid!==fresh.host);
    if(!players.length)return;
    if(!players.every(([,p])=>p.done===true))return;
    if(players.some(([,p])=>Number(p.score||0)>=5)||round>=Math.min(questions.length,Math.max(5,Number(fresh.gameLength)||5))){await update(roomRef(),{phase:'finished'});return;}
    const changes={round:round+1};
    for(const [pid] of players){
      changes[`players/${pid}/done`]=false;
      changes[`players/${pid}/failed`]=false;
    }
    await update(roomRef(),changes);
  }catch(e){message('自動換題失敗：'+e.message)}
  finally{advancingRounds.delete(round)}
}
async function hostSet(changes){if(!host||data.host!==id)return;try{await update(roomRef(),changes)}catch(e){message('操作失敗：'+e.message)}}
async function newRound(n){if(n>maxRounds()||activePlayers().some(([,p])=>Number(p.score||0)>=5)){await hostSet({phase:'finished'});return}const changes={round:n,phase:'playing'};for(const [pid] of activePlayers()){changes[`players/${pid}/done`]=false;changes[`players/${pid}/failed`]=false}await hostSet(changes)}
$('start').onclick=async()=>{const seed=Date.now();await hostSet({gameLength:Number($('gameLength').value),questionQueue:newBag(seed),questionCursor:0,createdAt:seed});data.gameLength=Number($('gameLength').value);await newRound(1)};$('next').onclick=()=>newRound((data.round||0)+1);
$('skip').onclick=()=>newRound((data.round||0)+1);
$('restart').onclick=async()=>{if(!confirm('確定讓全班再玩一次？所有星星將歸零，優先抽尚未出現的題目，40 題全部抽完才重洗，再次挑戰五星冠軍。'))return;const seed=Date.now();
  let queue=Array.isArray(data.questionQueue)?[...data.questionQueue]:newBag(roomSeed());
  let cursor=(Number(data.questionCursor)||0)+Math.max(0,Number(data.round)||0);
  // 舊版房間或抽題袋不夠長時補滿；只有整袋 40 題抽完才重新洗牌。
  while(queue.length-cursor<Math.min(questions.length,Math.max(5,Number(data.gameLength)||5))){
    const remaining=queue.length-cursor;
    const needed=Math.min(questions.length,Math.max(5,Number(data.gameLength)||5));
    // 先耗盡當前袋；若新的一局會跨袋，允許第 40 題後接新袋。
    queue.push(...newBag(seed^Math.imul(queue.length+1,0x9e3779b1)));
  }
  const changes={round:1,phase:'playing',createdAt:seed,gameLength:Number(data.gameLength)||5,questionQueue:queue,questionCursor:cursor};for(const [pid] of activePlayers()){changes[`players/${pid}/score`]=0;changes[`players/${pid}/done`]=false;changes[`players/${pid}/failed`]=false;changes[`players/${pid}/recipes`]=[]}await hostSet(changes)};
$('clear').onclick=()=>{selected=[];render()};$('copyRoom').onclick=()=>navigator.clipboard.writeText(room).then(()=>message('房號已複製')).catch(()=>message('請手動複製房號'));
$('submit').onclick=async()=>{const mine=data.players?.[id];if(host||!mine||mine.done||data.phase!=='playing'||selected.length!==3||busy)return;busy=true;const q=qNow(),good=selected.every(i=>q.correct.includes(i)),round=data.round;try{if(!good){await update(playerRef(),{failed:true});const n=Math.floor(Math.random()*disasters.length);showModal(`<img src="${disasters[n]}" alt="搞笑料理災難"><h2>哎呀！料理翻車了！</h2><p>再找找最適合的三張卡。再試一次！只要答對，一樣可以得到 1 顆星星！</p><button class="action" data-close>再試一次</button>`);selected=[];return}
const pr=playerRef();await runTransaction(pr,p=>{if(!p||p.done)return; p.done=true;p.score=(p.score||0)+1;const cards=q.correct.map(i=>q.cards[i]);p.recipes=[...(p.recipes||[]),`請幫我${cards[0]}，${cards[1]}，並且${cards[2]}。`];return p},{applyLocally:false});selected=[];if(data.phase==='playing')showModal(`<div class="banner"><h2>料理成功！＋1 顆星星</h2><p>客人很滿意！等待其他小廚神完成。</p></div><button class="action" data-close>查看全班進度</button>`);
const s=(await get(roomRef())).val();if(s?.phase==='playing'&&s.round===round){const ps=Object.entries(s.players||{}).filter(([pid])=>pid!==s.host).map(([,p])=>p);if(round>=maxRounds() && ps.length&&ps.every(p=>p.done)){await runTransaction(ref(db,`rooms/${room}/phase`),phase=>phase==='playing'?'finished':undefined,{applyLocally:false})}else if(ps.length&&ps.every(p=>p.done)){/* 老師端同步監聽器會自動切換到下一題 */}}}catch(e){message('送出失敗：'+e.message)}finally{busy=false;render()}};
</script></body></html>
